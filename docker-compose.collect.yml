# 분리된 수집 스택 (Airflow → Kafka → MySQL)
# 변경: 기존 docker-compose.yml에서 수집 관련만 분리
x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@postgres/${AIRFLOW_POSTGRES_DB} # 변경: .env 분리
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:9092} # KRaft 내부 통신용
    NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
    NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
    KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW} # 변경: producer에서 참조
    KAFKA_TOPIC_CLEANED: ${KAFKA_TOPIC_CLEANED} # 변경: producer에서 참조
    KAFKA_TOPIC_ERROR: ${KAFKA_TOPIC_ERROR} # 변경: producer에서 참조
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER} # 변경: airflow-init에서 참조
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD} # 변경
    AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME} # 변경
    AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME} # 변경
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL} # 변경
  volumes: 
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow:/opt/airflow/airflow
    - ./kafka:/opt/airflow/kafka    # producer 모듈 import 경로
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  dns:
    - 8.8.8.8
    - 8.8.4.4
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  # ──────────────────────────────────────────────
  # Kafka 스택
  # ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    ports:
      - "29092:29092"   # 로컬 디버깅용 (host → localhost:29092)
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      # KRaft 필수: 단일 노드에서 broker + controller 역할 동시 수행
      KAFKA_PROCESS_ROLES: "broker,controller"
      # KRaft 필수: broker.id 대신 node.id 사용
      KAFKA_NODE_ID: "1"
      # KRaft 필수: controller quorum 식별자(노드ID@호스트:컨트롤러포트)
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # KRaft 필수: 컨트롤러용 리스너 이름 지정
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # 내부/외부/컨트롤러 리스너 분리
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      # 서비스/컨테이너는 kafka:9092, 로컬 호스트는 localhost:29092 로 접속
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST:-localhost}:29092"
      # listener 이름별 프로토콜 매핑(컨트롤러 포함 필수)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # KRaft metadata 및 로그 저장 경로(영속 볼륨)
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # KRaft 필수: 스토리지 포맷에 사용할 클러스터 ID (고정값 유지 필요)
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      # 단일 노드 개발용 안정 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    command:
      - /bin/bash
      - -c
      - |
        if [ ! -f "$$KAFKA_LOG_DIRS/meta.properties" ]; then
          echo "Formatting KRaft storage with CLUSTER_ID=$$CLUSTER_ID"
          kafka-storage format --ignore-formatted --cluster-id "$$CLUSTER_ID" --config /etc/kafka/kraft/server.properties
        fi
        /etc/confluent/docker/run
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null | head -1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:9092} # KRaft 내부 통신용
      KAFKA_TOPICS: ${KAFKA_TOPICS} # 변경
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS} # 변경
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR} # 변경
      KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS} # 변경
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"   # 호스트 8085 → 컨테이너 8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:9092} # KRaft 내부 통신용
    depends_on:
      kafka:
        condition: service_healthy

  blog-consumer:
    build:
      context: ./kafka
      dockerfile: Dockerfile.consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:9092} # KRaft 내부 통신용
      KAFKA_TOPIC: ${KAFKA_TOPIC_RAW} # 변경
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_RAW} # 변경
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET} # 변경
      CONSUMER_POLL_TIMEOUT_MS: ${CONSUMER_POLL_TIMEOUT_MS} # 변경
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES} # 변경
      DB_CONNECT_RETRY_DELAY: ${DB_CONNECT_RETRY_DELAY} # 변경
      MYSQL_HOST: ${CONSUMER_MYSQL_HOST} # 변경: fallback 제거
      MYSQL_PORT: ${CONSUMER_MYSQL_PORT} # 변경
      MYSQL_DATABASE: ${CONSUMER_MYSQL_DATABASE} # 변경
      MYSQL_USER: ${CONSUMER_MYSQL_USER} # 변경
      MYSQL_PASSWORD: ${CONSUMER_MYSQL_PASSWORD} # 변경
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Airflow 스택
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER} # 변경: .env 분리
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD} # 변경
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB} # 변경
    volumes:
      - airflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER}"] # 변경
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: >
      bash -lc "airflow db migrate &&
      airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname ${AIRFLOW_ADMIN_FIRSTNAME} --lastname ${AIRFLOW_ADMIN_LASTNAME} --role Admin --email ${AIRFLOW_ADMIN_EMAIL} || true" # 변경: .env 분리
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always

volumes:
  airflow_postgres:
  airflow_logs:
  airflow_plugins:
  kafka_data:

# 분리된 분석 스택 (Flink + Redis + Spark Batch)
# 변경: 기존 docker-compose.yml에서 분석 관련만 분리
# 참고: Kafka 브로커는 외부에 있어야 하며, KAFKA_BOOTSTRAP_SERVERS로 접근 가능해야 함

x-spark-image: &spark_image
  build:
    context: .
    dockerfile: ./spark/Dockerfile
  image: trend_spark_custom:latest

services:
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  flink-jobmanager:
    build:
      context: ./flink
    hostname: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC_CLEANED}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_FLINK}
      KAFKA_TOP_TOKENS_GROUP_ID: flink-top-tokens-10m
      KAFKA_RISING_TOKENS_GROUP_ID: flink-rising-tokens-10m
      KAFKA_STARTING_OFFSETS: ${KAFKA_STARTING_OFFSETS}
      REDIS_HOST: ${REDIS_HOST_INTERNAL}
      REDIS_PORT: ${REDIS_PORT_INTERNAL}
      REDIS_DB: ${REDIS_DB_INTERNAL}
      REDIS_KEY_TREND: ${REDIS_KEY_TREND}
      REDIS_KEY_TREND_HISTORY: ${REDIS_KEY_TREND_HISTORY:-trend:traffic:10m:history}
      REDIS_TREND_HISTORY_MAX_LEN: ${REDIS_TREND_HISTORY_MAX_LEN:-48}
      REDIS_KEY_TOP: ${REDIS_KEY_TOP}
      REDIS_KEY_RISING: ${REDIS_KEY_RISING}
      REDIS_TOP_TOKENS_TTL_SECONDS: 86400
      TOP_TOKENS_STOPWORDS_FILE: /opt/flink/usrlib/stopwords_ko.txt
    volumes:
      - ./flink/traffic_10m_to_redis_job.py:/opt/flink/usrlib/traffic_10m_to_redis_job.py
      - ./flink/top_tokens_10m_to_redis_job.py:/opt/flink/usrlib/top_tokens_10m_to_redis_job.py
      - ./flink/rising_tokens_10m_to_redis_job.py:/opt/flink/usrlib/rising_tokens_10m_to_redis_job.py
      - ./flink/stopwords_ko.txt:/opt/flink/usrlib/stopwords_ko.txt
    depends_on:
      redis:
        condition: service_healthy

  flink-taskmanager:
    build:
      context: ./flink
    hostname: flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        taskmanager.numberOfTaskSlots: 3
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC_CLEANED}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_FLINK}
      KAFKA_TOP_TOKENS_GROUP_ID: flink-top-tokens-10m
      KAFKA_RISING_TOKENS_GROUP_ID: flink-rising-tokens-10m
      KAFKA_STARTING_OFFSETS: ${KAFKA_STARTING_OFFSETS}
      REDIS_HOST: ${REDIS_HOST_INTERNAL}
      REDIS_PORT: ${REDIS_PORT_INTERNAL}
      REDIS_DB: ${REDIS_DB_INTERNAL}
      REDIS_KEY_TREND: ${REDIS_KEY_TREND}
      REDIS_KEY_TREND_HISTORY: ${REDIS_KEY_TREND_HISTORY:-trend:traffic:10m:history}
      REDIS_TREND_HISTORY_MAX_LEN: ${REDIS_TREND_HISTORY_MAX_LEN:-48}
      REDIS_KEY_TOP: ${REDIS_KEY_TOP}
      REDIS_KEY_RISING: ${REDIS_KEY_RISING}
      REDIS_TOP_TOKENS_TTL_SECONDS: 86400
      TOP_TOKENS_STOPWORDS_FILE: /opt/flink/usrlib/stopwords_ko.txt
    volumes:
      - ./flink/traffic_10m_to_redis_job.py:/opt/flink/usrlib/traffic_10m_to_redis_job.py
      - ./flink/top_tokens_10m_to_redis_job.py:/opt/flink/usrlib/top_tokens_10m_to_redis_job.py
      - ./flink/rising_tokens_10m_to_redis_job.py:/opt/flink/usrlib/rising_tokens_10m_to_redis_job.py
      - ./flink/stopwords_ko.txt:/opt/flink/usrlib/stopwords_ko.txt
    depends_on:
      flink-jobmanager:
        condition: service_started
      redis:
        condition: service_healthy

  flink-job-submitter:
    build:
      context: ./flink
    hostname: flink-job-submitter
    command: ["/bin/bash", "/opt/flink/usrlib/submit_jobs.sh"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.port: 8081
        rest.address: flink-jobmanager
      JOBMANAGER_URL: http://flink-jobmanager:8081
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC_CLEANED}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_FLINK}
      KAFKA_TOP_TOKENS_GROUP_ID: flink-top-tokens-10m
      KAFKA_RISING_TOKENS_GROUP_ID: flink-rising-tokens-10m
      KAFKA_STARTING_OFFSETS: ${KAFKA_STARTING_OFFSETS}
      REDIS_HOST: ${REDIS_HOST_INTERNAL}
      REDIS_PORT: ${REDIS_PORT_INTERNAL}
      REDIS_DB: ${REDIS_DB_INTERNAL}
      REDIS_KEY_TREND: ${REDIS_KEY_TREND}
      REDIS_KEY_TREND_HISTORY: ${REDIS_KEY_TREND_HISTORY:-trend:traffic:10m:history}
      REDIS_TREND_HISTORY_MAX_LEN: ${REDIS_TREND_HISTORY_MAX_LEN:-48}
      REDIS_KEY_TOP: ${REDIS_KEY_TOP}
      REDIS_KEY_RISING: ${REDIS_KEY_RISING}
      REDIS_TOP_TOKENS_TTL_SECONDS: 86400
      TOP_TOKENS_STOPWORDS_FILE: /opt/flink/usrlib/stopwords_ko.txt
    volumes:
      - ./flink/traffic_10m_to_redis_job.py:/opt/flink/usrlib/traffic_10m_to_redis_job.py
      - ./flink/top_tokens_10m_to_redis_job.py:/opt/flink/usrlib/top_tokens_10m_to_redis_job.py
      - ./flink/rising_tokens_10m_to_redis_job.py:/opt/flink/usrlib/rising_tokens_10m_to_redis_job.py
      - ./flink/stopwords_ko.txt:/opt/flink/usrlib/stopwords_ko.txt
      - ./flink/submit_jobs.sh:/opt/flink/usrlib/submit_jobs.sh
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    hostname: backend
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_KEY_TREND: ${REDIS_KEY_TREND}
      REDIS_KEY_TOP: ${REDIS_KEY_TOP}
      REDIS_KEY_RISING: ${REDIS_KEY_RISING}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REPORT_TABLE: ${REPORT_TABLE}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Spark (Batch Prediction)
  # ──────────────────────────────────────────────
  spark-master:
    <<: *spark_image
    hostname: spark-master
    command: >
      bash -lc "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080"
    environment:
      - TZ=Asia/Seoul
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYTHONPATH=/opt/spark-app/spark/daily_pipeline:/opt/spark-app/spark
    volumes:
      - ./spark:/opt/spark-app/spark
    ports:
      - "7077:7077"
      - "8088:8080"  # airflow(8080) 충돌 방지

  spark-worker-1:
    <<: *spark_image
    hostname: spark-worker-1
    command: >
      bash -lc "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081"
    environment:
      - TZ=Asia/Seoul
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYTHONPATH=/opt/spark-app/spark
    volumes:
      - ./spark:/opt/spark-app/spark
    depends_on:
      spark-master:
        condition: service_started
    ports:
      - "8089:8081"

  spark-batch:
    <<: *spark_image
    hostname: spark-batch
    depends_on:
      spark-master:
        condition: service_started
    environment:
      TZ: Asia/Seoul
      PYTHONPATH: /opt/spark-app/spark

      # OpenAI (report generation)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.4}

      # MySQL (external)
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # Table names
      RAW_TABLE: "${RAW_TABLE:-blog_post}"
      CLEANED_TABLE: "${CLEANED_TABLE:-cleaned_docs}"
      STATS_TABLE: "${STATS_TABLE:-daily_token_stats}"
      PRED_TABLE: "${PRED_TABLE:-predictions}"

      # discovered_at timezone handling
      DISCOVERED_AT_IS_UTC: "${DISCOVERED_AT_IS_UTC:-true}"

      # Pipeline
      RUN_DATE: "${RUN_DATE:-2026-02-25}"
      WINDOW_DAYS: "${WINDOW_DAYS:-7}"
      TOP_N: "${TOP_N:-50}"
      REBUILD_WINDOW: "${REBUILD_WINDOW:-true}"

      # Candidate thresholds
      MIN_DOC_TODAY: "${MIN_DOC_TODAY:-5}"
      MIN_COUNT_TODAY: "${MIN_COUNT_TODAY:-10}"

      # Burst thresholds
      GROWTH_RATIO_MIN: "${GROWTH_RATIO_MIN:-2.0}"
      PREV_MEAN_MAX: "${PREV_MEAN_MAX:-3.0}"

      # Score weights
      W_BURST: "${W_BURST:-1.5}"
      W_STABLE: "${W_STABLE:-0.7}"
      W_UNCERTAIN: "${W_UNCERTAIN:-0.3}"

      # Token filters
      MIN_TOKEN_LEN: "${MIN_TOKEN_LEN:-2}"
      MAX_TOKEN_LEN: "${MAX_TOKEN_LEN:-20}"

      # Tokenizer
      TOKENIZER_MODE: "${TOKENIZER_MODE:-morph}"
      MORPH_ALLOWED_TAGS: "${MORPH_ALLOWED_TAGS:-NNG,NNP,NNB,NR,NP,SL}"

      # Stopwords (지니 현재 spark 폴더 구조 기준)
      STOPWORDS_PATH: "${STOPWORDS_PATH:-/opt/spark-app/spark/resources/stopwords_ko.txt}"

    volumes:
      - ./spark:/opt/spark-app/spark

    command: >
      bash -lc "/opt/spark/bin/spark-submit --master spark://spark-master:7077
      --conf spark.sql.session.timeZone=Asia/Seoul
      --conf spark.driverEnv.PYTHONPATH=/opt/spark-app/spark
      --conf spark.executorEnv.PYTHONPATH=/opt/spark-app/spark
      --conf spark.driver.extraClassPath=/opt/spark/jars/mysql-connector-j-8.4.0.jar
      --conf spark.executor.extraClassPath=/opt/spark/jars/mysql-connector-j-8.4.0.jar
      /opt/spark-app/spark/daily_pipeline/daily_pipeline_job.py
      --run-date $${RUN_DATE}
      --window-days $${WINDOW_DAYS}
      --top-n $${TOP_N}
      --rebuild-window $${REBUILD_WINDOW}"

volumes:
  redis_data:
